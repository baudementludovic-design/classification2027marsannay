<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement 2026 – Carreau de Marsannay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c74543; --red-soft:#f6dedd; --red-text:#c74543;
  --navy:#1d2432; --cream:#fbf3ef;
  --bg:#f7f4f2; --surface:#ffffff; --text:#1d2432; --muted:#6b707c; --line:#e6e0dc; --chip:#ece7e4;
  --mine:#fdf0ef;
  --gold:#d9a227; --silver:#9aa1ad; --bronze:#b27449;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red-soft:#3e2222; --red-text:#e8726f; --bg:#14171e; --surface:#1d212b; --text:#eef0f4; --muted:#a2a7b3;
  --line:#2c313d; --chip:#2a2f3a; --mine:#2b1f22; color-scheme:dark;}}
:root[data-theme="dark"]{
  --red-soft:#3e2222; --red-text:#e8726f; --bg:#14171e; --surface:#1d212b; --text:#eef0f4; --muted:#a2a7b3;
  --line:#2c313d; --chip:#2a2f3a; --mine:#2b1f22; color-scheme:dark;}
body[data-v="cd"]{--red:#1b22d8;--red-soft:#e2e4fb;--red-text:#1b22d8;--hero-hi:#3b42ea;--year:#d4d7e0}
body[data-v="cd"] .hero{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-v="cd"]{--red-soft:#22265a;--red-text:#9ea3ff}}
:root[data-theme="dark"] body[data-v="cd"]{--red-soft:#22265a;--red-text:#9ea3ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.stencil{font-family:"Black Ops One","Arial Black",Impact,sans-serif;font-weight:400;letter-spacing:.02em}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}

/* Bandeau rouge */
.hero{margin:20px 0 14px;background:radial-gradient(120% 90% at 10% 40%,var(--hero-hi,#d0605d) 0%,var(--red) 55%);border-radius:28px;padding:26px 22px 22px;color:var(--cream)}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:clamp(72px,19vw,132px);height:auto;flex:none}
.brand{min-width:0}
h1{margin:0;line-height:.95;font-size:clamp(25px,6.8vw,64px);min-width:0}
h1 span{display:block}
h1 .y{color:var(--year,var(--navy))}
.lg-cd{display:none;background:#fff;border-radius:22px;padding:8px}
body[data-v="cd"] .lg-club{display:none}body[data-v="cd"] .lg-cd{display:block}
.dot{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:#f93634;margin-left:.18em;vertical-align:.12em;opacity:0}
body[data-v="cd"] .dot{opacity:1}
.lead{margin:18px 0 18px;font-size:clamp(16px,3.6vw,19px);line-height:1.45;max-width:60ch}

.podium{background:#fff;color:#1d2432;border-radius:18px;padding:16px 16px 14px;border:1px solid #efe6e2}
.podium h2{margin:0 0 10px;font:600 13px/1 "IBM Plex Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6b707c}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pl{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:4px solid var(--gold)}
.pl:nth-child(2){border-color:var(--silver)} .pl:nth-child(3){border-color:var(--bronze)}
.pl .r{font:600 13px/1.2 "IBM Plex Sans",sans-serif;color:#6b707c}
.pl .nm{font:700 clamp(17px,4.2vw,24px)/1.05 "Barlow Condensed",sans-serif}
.pl .pt{font:800 clamp(28px,7vw,40px)/1 "Barlow Condensed",sans-serif;color:var(--red);margin-top:4px}
.pl .pt small{font-size:.45em;font-weight:700;color:#6b707c;margin-left:2px}
.pl .cl{font-size:12px;color:#6b707c;line-height:1.25}

/* Outils */
.tools{display:flex;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ctl{font:inherit;font-size:17px;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;width:100%}
.search .ctl{padding-left:46px}
select.ctl{flex:0 1 260px;width:auto;border-color:var(--red);color:var(--red-text);background:var(--red-soft);font-weight:600}
.pdf{display:inline-flex;align-items:center;gap:8px;font:600 17px/1 "IBM Plex Sans",sans-serif;color:#fff;background:var(--red);border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
.pdf:disabled{opacity:.6;cursor:progress}
.pdf:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.pdf-msg{flex:1 1 100%;margin:0;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:5px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;font:600 17px/1 "IBM Plex Sans",sans-serif;color:var(--muted);padding:11px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(29,36,50,.12)}
.ctl:focus-visible,.seg button:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.sect{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:26px 0 0;padding-bottom:12px;border-bottom:2px solid var(--line)}
.sect h2{margin:0;font-size:clamp(26px,6.4vw,40px);line-height:1;color:var(--text)}
.sect .count{color:var(--muted);font-size:17px}

.list{margin:0 0 24px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row.mine{background:var(--mine);box-shadow:inset 4px 0 0 #c74543}
.rk{text-align:center;line-height:1}
.rk b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif}
.rk small{display:block;font:600 11px/1.2 "IBM Plex Sans",sans-serif;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.who .nm{font-weight:700;font-size:17px;line-height:1.25}
.who .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.chip{font:600 13px/1 "IBM Plex Sans",sans-serif;padding:5px 9px;border-radius:7px;background:var(--chip);color:var(--muted)}
.chip.s{background:var(--red-soft);color:var(--red-text);letter-spacing:.05em}
.pts{text-align:right;min-width:56px}
.pts b{font:800 32px/1 "Barlow Condensed",sans-serif;color:var(--red-text)}
.pts.z b{color:var(--muted);font-weight:700}
.pts small{display:block;font-size:12px;color:var(--muted)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.more{display:block;margin:0 auto 30px;font:600 16px/1 "IBM Plex Sans",sans-serif;color:var(--text);background:var(--surface);border:1.5px solid var(--navy);border-radius:999px;padding:13px 22px;cursor:pointer}
:root[data-theme="dark"] .more{border-color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding-bottom:36px}

@media (max-width:560px){
  .hero{padding:20px 16px 16px;border-radius:24px}
  .pod{gap:8px}.pl{padding-left:8px}
  .row{grid-template-columns:48px 1fr auto;gap:10px}
  .rk b{font-size:26px}
  .seg{width:100%}.seg button{flex:1}
  select.ctl{flex:1 1 100%}
  .pdf{flex:1 1 100%;justify-content:center}
}
@media (prefers-reduced-motion:no-preference){.row.mine{transition:background .2s}}
@media print{.tools,.more{display:none}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

const cap=s=>s.toLowerCase().replace(/(^|[\s'-])\p{L}/gu,m=>m.toUpperCase());
const ACR=/\b(Uscvl|Asptt|Atscaf)\b/g;
const ttl=s=>cap(s).replace(ACR,w=>w.toUpperCase()).replace(/\b(De|Du|Des|La|Le|Les|L|D|Et)\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase());
const norm=s=>s.toLowerCase().normalize("NFD").replace(/\p{M}/gu,"");
DATA.sort((a,b)=>b.pts-a.pts||a.n.localeCompare(b.n,"fr")||a.p.localeCompare(b.p,"fr"));
DATA.forEach((d,i)=>{d.rd=(i&&DATA[i-1].pts===d.pts)?DATA[i-1].rd:i+1;d.k=norm(d.n+" "+d.p+" "+d.p+" "+d.n);});
const CLUBROWS=DATA.filter(d=>d.c===CLUB);
CLUBROWS.forEach((d,i)=>{d.rc=(i&&CLUBROWS[i-1].pts===d.pts)?CLUBROWS[i-1].rc:i+1;});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clubs=[...new Set(DATA.map(d=>d.c))].sort();
$("club").innerHTML='<option value="">Tous les clubs</option>'+clubs.map(c=>`<option value="${esc(c)}">${esc(ttl(c))}</option>`).join("");
const PAGE=200; let view="club", shown=PAGE, rows=[];
const plural=(n,w)=>n.toLocaleString("fr-FR")+" "+w+(n>1?"s":"");

function row(d){
  const r=view==="club"?d.rc:d.rd;
  const sub=view==="club"?`<small>${d.rd}<sup>e</sup> CD</small>`:"";
  const meta=(view==="cd"?`<span class="chip">${esc(ttl(d.c))}</span>`:"")+(d.s?`<span class="chip s">${esc(d.s)}</span>`:"");
  return `<div class="row${view==="cd"&&d.c===CLUB?" mine":""}"><div class="rk"><b>${r}</b>${sub}</div>
  <div class="who"><div class="nm">${esc(d.n)} ${esc(cap(d.p))}</div><div class="meta">${meta}</div></div>
  <div class="pts${d.pts?"":" z"}"><b>${d.pts}</b><small>pt${d.pts>1?"s":""}</small></div></div>`;
}
function draw(){
  $("list").innerHTML=rows.length?rows.slice(0,shown).map(row).join(""):'<div class="empty">Aucun joueur ne correspond à cette recherche. Vérifiez l’orthographe ou choisissez un autre club.</div>';
  $("more").hidden=rows.length<=shown;
  $("more").textContent=`Afficher les joueurs suivants (${rows.length-shown} restants)`;
}
function render(){
  const base=view==="club"?CLUBROWS:DATA;
  const q=norm($("q").value.trim()), cf=view==="cd"?$("club").value:"";
  rows=base.filter(d=>(!cf||d.c===cf)&&(!q||q.split(/\s+/).every(t=>d.k.includes(t))));
  shown=PAGE;
  $("count").textContent=plural(rows.length,"joueur");
  draw();
}
function setView(v){
  view=v; document.body.dataset.v=v;
  $("t-club").setAttribute("aria-selected",v==="club");$("t-cd").setAttribute("aria-selected",v==="cd");
  $("club").hidden=v!=="cd";
  const base=v==="club"?CLUBROWS:DATA;
  $("lead").textContent=v==="club"
    ?`Les points 2026 des ${CLUBROWS.length.toLocaleString("fr-FR")} licenciés du Carreau de Marsannay, avec leur rang au sein du club et dans le comité de Côte-d’Or.`
    :`Les points 2026 des ${DATA.length.toLocaleString("fr-FR")} licenciés du comité de Côte-d’Or, tous clubs confondus.`;
  $("podT").textContent=v==="club"?"Podium du club":"Podium du CD21";
  $("sectT").textContent=v==="club"?"CARREAU DE MARSANNAY":"CÔTE-D’OR";
  $("pod").innerHTML=base.slice(0,3).map(d=>`<div class="pl"><span class="r">${(v==="club"?d.rc:d.rd)===1?"1<sup>er</sup>":(v==="club"?d.rc:d.rd)+"<sup>e</sup>"}</span>
    <span class="nm">${esc(cap(d.p))} ${esc(d.n)}</span>${v==="cd"?`<span class="cl">${esc(ttl(d.c))}</span>`:""}
    <span class="pt">${d.pts}<small>pts</small></span></div>`).join("");
  try{history.replaceState(null,"",v==="cd"?"#cd21":"#club");}catch(e){}
  render();
}
$("t-club").onclick=()=>setView("club");$("t-cd").onclick=()=>setView("cd");
$("q").oninput=render;$("club").onchange=render;
$("more").onclick=()=>{shown+=PAGE;draw();};

// ===== Export PDF =====
const pdfTxt=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
function msg(t){const m=$("pdfMsg");m.textContent=t;m.hidden=!t;}
async function exportPdf(){
  if(!window.jspdf){msg("Le module PDF n’a pas pu se charger. Rechargez la page puis réessayez.");return;}
  if(!rows.length){msg("La liste affichée est vide : il n’y a rien à extraire.");return;}
  const btn=$("pdf");btn.disabled=true;msg("");
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:"mm",format:"a4"});
    const cd=view==="cd", cf=cd?$("club").value:"";
    const col=cd?[27,34,216]:[199,69,67];
    const scope=cd?(cf?ttl(cf):"Comité de Côte-d'Or"):"Carreau de Marsannay";
    const q=$("q").value.trim();
    const logoEl=document.querySelector(cd?".lg-cd":".lg-club");
    const W=doc.internal.pageSize.getWidth();
    const head=()=>{
      doc.setFillColor(...col);doc.rect(0,0,W,30,"F");
      if(cd){doc.setFillColor(255,255,255);doc.roundedRect(10,4,22,22,3,3,"F");}
      try{if(cd)doc.addImage(logoEl.src,"PNG",11.5,5.5,19,19*logoEl.naturalHeight/logoEl.naturalWidth);else doc.addImage(logoEl.src,"PNG",10,4,22*logoEl.naturalWidth/logoEl.naturalHeight,22);}catch(e){}
      doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(20);
      doc.text("Classement 2026",38,14);
      doc.setFont("helvetica","normal");doc.setFontSize(11);
      doc.text(pdfTxt(scope+(q?" - recherche : "+q:"")+" - "+plural(rows.length,"joueur").replace(/\u202f|\u00a0/g," ")),38,22);
    };
    const body=rows.map(d=>{
      const r=[cd?d.rd:d.rc];
      if(!cd)r.push(d.rd);
      r.push(pdfTxt(d.n),pdfTxt(cap(d.p)));
      if(cd)r.push(pdfTxt(ttl(d.c)));
      r.push(d.s||"",d.pts);
      return r;
    });
    const hd=cd?["Rang","Nom","Prénom","Club","Cat.","Points"]:["Rang","Rang CD","Nom","Prénom","Cat.","Points"];
    doc.autoTable({
      head:[hd],body,startY:36,margin:{top:36,left:10,right:10,bottom:16},
      styles:{font:"helvetica",fontSize:9,cellPadding:1.8,textColor:[29,36,50],lineColor:[230,224,220],lineWidth:.1},
      headStyles:{fillColor:[29,36,50],textColor:255,fontStyle:"bold"},
      alternateRowStyles:{fillColor:[247,244,242]},
      columnStyles:cd?{0:{halign:"center",cellWidth:13},4:{halign:"center",cellWidth:12},5:{halign:"right",cellWidth:16,fontStyle:"bold"}}
                     :{0:{halign:"center",cellWidth:13},1:{halign:"center",cellWidth:18},4:{halign:"center",cellWidth:12},5:{halign:"right",cellWidth:16,fontStyle:"bold"}},
      didParseCell:h=>{if(cd&&h.section==="body"&&rows[h.row.index].c===CLUB&&!cf){h.cell.styles.fillColor=[253,240,239];}},
      didDrawPage:()=>{head();doc.setFontSize(8);doc.setTextColor(107,112,124);
        doc.text("Licenciés avec une reprise en 2026 ou 2027. À égalité de points, le rang est partagé.",10,290);
        doc.text("Page "+doc.internal.getNumberOfPages(),W-10,290,{align:"right"});}
    });
    const slug=scope.toLowerCase().normalize("NFD").replace(/\p{M}/gu,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const filename="classement-2026-"+slug+".pdf";
    const blob=doc.output("blob");
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){
      try{await dl.save({filename,data:blob});msg("PDF enregistré.");}
      catch(e){ if(e&&e.code==="declined")msg("Extraction annulée.");
        else if(e&&e.code==="rate_limited")msg("Une fenêtre d’enregistrement est déjà ouverte. Réessayez dans un instant.");
        else msg("L’enregistrement du PDF n’est pas disponible ici.");}
    } else { doc.save(filename); }
  }catch(e){msg("Le PDF n’a pas pu être généré. Réessayez.");console.error(e);}
  finally{btn.disabled=false;}
}
$("pdf").onclick=exportPdf;
const h=()=>setView(location.hash==="#cd21"?"cd":"club");
addEventListener("hashchange",h);h();
</script>
</body>
</html>
